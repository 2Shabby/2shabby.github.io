# Projects Data File
# This is the source of truth for the projects page
# Edit this file to add, remove, or modify projects and categories

categories:
  # LLM Infrastructure & Agents
  - key: llm-infra-agents
    label: "LLM Infrastructure & Agents"
    description: "The plumbing underneath useful agents"
    items:
      - slug: jeeves-runtime
        name: "Jeeves Agentic Runtime"
        tagline: "A runtime that lets LLM agents pause, resume, and share infrastructure"
        status: active
        repo_url: "https://github.com/Jeeves-Cluster-Organization/jeeves-core"
        tags:
          - LLM
          - Agents
          - Python
          - Go
          - gRPC
          - PostgreSQL
        summary: "The layer that sits between a model and an agent that actually does something. Handles the parts that every agent needs but nobody wants to rewrite: persistent state, checkpointing so long runs can be interrupted and picked back up, provider-agnostic model access, and clean module boundaries so capabilities don't leak into each other. Works with OpenAI, Anthropic, and local models."

      - slug: jeeves-code-analysis
        name: "Jeeves Code Analysis Pipeline"
        tagline: "An agent that explores codebases without making things up"
        status: active
        repo_url: "https://github.com/Jeeves-Cluster-Organization/jeeves-capability-code-analysis"
        tags:
          - LLM
          - Agents
          - Python
          - PostgreSQL
          - pgvector
        summary: "A read-only agent for understanding large codebases. The interesting part is the citation layer — every claim the model makes about the code is checked against the actual source, so hallucinated function names and invented behavior get caught before they reach the user. Uses a mix of exact search, structural search, and semantic search depending on what the agent is looking for."

      - slug: jeeves-assistant
        name: "Jeeves Personal Assistant"
        tagline: "A capability built on the Jeeves runtime — tasks, notes, and long-term memory"
        status: active
        tags:
          - LLM
          - Agents
          - Python
          - PostgreSQL
          - pgvector
        summary: "A personal assistant capability that handles tasks, journaling, and reminders. Mainly a testbed for what useful long-term memory looks like in practice — searching past entries by meaning rather than keywords, keeping an audit trail of what the agent changed and why, and handling concurrent edits safely."

      - slug: voice-gateway
        name: "Edge Voice Assistant"
        tagline: "A voice agent that runs entirely on a small ARM box"
        status: active
        repo_url: "https://github.com/Jeeves-Cluster-Organization/voice_radxa_gateway"
        tags:
          - LLM
          - Edge
          - Python
          - ARM
          - ONNX
        summary: "A voice interface for Jeeves that runs on-device — wake word, speech-to-text, and text-to-speech all happen locally, with no round-trip to the cloud. Uses the onboard NPU to keep the models fast enough to feel responsive. Part of the broader interest in pushing more of the agent stack onto local hardware."

  # Research Background
  - key: research
    label: "Research Background"
    description: "Earlier work in quantum ML — kept here because the problems were genuinely hard"
    items:
      - slug: quantum-density-ml
        name: "Generating Valid Quantum States with Neural Nets"
        tagline: "Networks that produce physically valid outputs by construction, not by luck"
        status: past
        repo_url: "https://github.com/2Shabby/broadcastability_ml_project"
        tags:
          - Quantum
          - ML
          - Research
          - PyTorch
        summary: "Training neural networks to generate quantum states is hard because most outputs aren't physically valid. The trick here was baking the validity constraints directly into the architecture, so every sample the network produces is a legitimate quantum state — no rejection sampling, no post-hoc fixing."

      - slug: quantum-witness-ml
        name: "Learning Entanglement Witnesses"
        tagline: "Classifiers that certify quantum entanglement from fewer measurements"
        status: past
        repo_url: "https://github.com/Jeeves-Cluster-Organization/ML_QML_Witness_Generation"
        tags:
          - Quantum
          - ML
          - Research
          - PyTorch
        summary: "Training models to tell whether a quantum state has useful entanglement, using far fewer measurements than the standard approaches need. Tested across a range of canonical states."

      - slug: quantum-entanglement
        name: "Fully Entangled Fraction"
        tagline: "Symbolic analysis of entanglement in multi-qubit networks"
        status: past
        tags:
          - Quantum
          - Research
          - Mathematica
        summary: "Symbolic math work on how entangled different multi-qubit network configurations are, and how well they'd hold up as a resource for quantum teleportation."
