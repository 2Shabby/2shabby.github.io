title: "Shahbaz Shaik"
description: "Software engineer building small, local-first systems and games."
author:
  name: "Shahbaz Shaik"
  email: "shaikmohdshahbaz@gmail.com"

url: "https://2shabby.github.io"
baseurl: ""
lang: en
timezone: Asia/Kolkata

links:
  github: "https://github.com/2Shabby"
  itch: "https://2shabby.itch.io/"
  linkedin: "https://linkedin.com/in/mohd-shahbaz-shaik"
  email: "mailto:shaikmohdshahbaz@gmail.com"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

excerpt_separator: "<!--more-->"
permalink: pretty

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Shahbaz Shaik"

plugins: []

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - README.md
  - LICENSE
  - .git/
  - .gitignore
